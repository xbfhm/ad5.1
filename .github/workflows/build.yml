name: Build TV APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev lld libsqlite3-dev libxml2-dev libxslt1-dev
          pip install --upgrade pip setuptools wheel
          # 核心修复：强制回退并锁定 python-for-android 版本，迫使它使用稳定的 Python 3.10/3.11，拒绝 3.14！
          pip install buildozer==1.5.0 cython==3.0.11 python-for-android==2024.1.21

      - name: Build APK with Buildozer
        # 将所有的编译日志重定向保存到 build.log 文件中，防止终端截断
        run: |
          buildozer -v android debug > build.log 2>&1 || { echo "Build failed!"; tail -n 300 build.log; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: animetv-apk
          path: bin/*.apk

      - name: Upload Error Log
        uses: actions/upload-artifact@v4
        # 无论成功还是失败，都将完整的日志文件作为附件上传，方便我们直接下载查看
        if: always()
        with:
          name: buildozer-full-log
          path: build.log
